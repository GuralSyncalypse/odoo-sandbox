services:
  website:
    build:
      context: ./website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TELESALES_WEBSITE_URL: ${TELESALES_WEBSITE_URL:-http://localhost:3000}
      TELESALES_ODOO_BASE_URL: ${TELESALES_ODOO_BASE_URL:-http://web:8069}
      TELESALES_JWT_ISSUER: ${TELESALES_JWT_ISSUER:-website}
      TELESALES_JWT_AUDIENCE: ${TELESALES_JWT_AUDIENCE:-odoo}
      TELESALES_JWT_TTL_SECONDS: ${TELESALES_JWT_TTL_SECONDS:-900}
      TELESALES_JWT_PRIVATE_KEY_PEM: ${TELESALES_JWT_PRIVATE_KEY_PEM}
      TELESALES_ADMIN_SUBJECTS: ${TELESALES_ADMIN_SUBJECTS:-}
    depends_on:
      web:
        condition: service_healthy

  web:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Reverse proxy online
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8069/web/login', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  odoo-web-data:
  odoo-db-data:
